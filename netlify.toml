# Netlify configuration
# This is a plain static site — nothing to build, just publish the folder.

[build]
  publish = "."
  command = ""

# Sensible security headers. These cost nothing and look right if anyone checks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Caching.
#
# The rule is whether a file's NAME changes when its contents change.
#
# Screenshots do: replacing one means a new filename in the gallery markup, so
# an old copy in someone's cache is never wrong, only unused. Those can be held
# for a year.
#
# The stylesheets, the scripts and the resume PDF do not — they are edited in
# place under the same name. They used to be cached for a week and a year
# respectively, which meant a visitor who had already loaded the site kept the
# old stylesheet while getting the new HTML, and saw a broken page. The resume
# was worse: a recruiter who downloaded it once would have been handed the same
# stale file for a year.
#
# Netlify serves ETags, so must-revalidate costs one conditional request that
# answers 304 when nothing changed. On a site this size that is not a cost
# worth trading a wrong page for.

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
